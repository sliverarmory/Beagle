[package]
name = "beagle"
version = "0.1.0"
edition = "2024"
description = "Headless Active Directory graph analysis with Rust and GraphQLite"
license = "Apache-2.0"

[lib]
name = "beagle"

[[bin]]
name = "beagle"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
hex = "0.4"
# Expose the bundled SQLite header path to build.rs. Keep this version aligned
# with rusqlite so GraphQLite and Rust use one SQLite implementation.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
